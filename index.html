<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#172554">
    <title>KEYRADDIIN EDUCATION APP</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KEYRADDIIN">
    
    <!-- Favicons (Suuraalee appii) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    
    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand-container">
            <div class="brand-logo-box">K</div>
            <div class="brand-text">
                <h1>KEYRADDIIN</h1>
                <span>EDUCATION APP</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">🌙</button>
            <button id="profileButton" class="icon-btn" aria-label="Profile">👤</button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main id="appMain">
        <!-- Dynamic content loads here -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav" aria-label="Main Navigation">
        <button class="nav-item active" data-page="home" aria-label="Home">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="exams" aria-label="Exams">
            <span class="nav-icon">📝</span>
            <span class="nav-label">Exams</span>
        </button>
        <button class="nav-item" data-page="ai" aria-label="AI Tutor">
            <span class="nav-icon">🤖</span>
            <span class="nav-label">AI Tutor</span>
        </button>
        <button class="nav-item" data-page="planner" aria-label="Planner">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Planner</span>
        </button>
        <button class="nav-item" data-page="settings" aria-label="Settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
